name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore SephiriaBuildOverlay.sln

      - name: Test
        run: dotnet test SephiriaBuildOverlay.sln -c Release --no-restore

      - name: Build and validate BepInEx-inclusive package
        shell: pwsh
        run: ./tools/BuildRelease.ps1

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: SephiriaBuildOverlay
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
